# Builds Fignimble.app (universal), signs and notarizes it, and attaches it to the GitHub Release of its tag.
#
#   Release:      bump VERSION, commit, then  git tag v0.2.0 && git push origin v0.2.0
#   Re-publish:   Actions -> release -> Run workflow (on main), with a tag (e.g. v0.1.0): builds main and replaces
#                 that release's zip (how a release made before signing was set up gets a notarized app)
#
# Signing and notarization need these repository secrets (the same ones Manimble's releases use; a paid Apple
# Developer ID account): APPLE_CERTIFICATE (base64 .p12 "Developer ID Application" certificate),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"), APPLE_ID,
# APPLE_PASSWORD (an app-specific password, not the Apple ID password), APPLE_TEAM_ID.
# Without them the build is ad-hoc signed and kept as a workflow artifact only; the release is left as it is.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # `secrets` can't be read in a step's `if:`, so expose whether signing is configured here.
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # a tag push builds that tag; a manual run builds the branch it is run from and publishes to the given tag
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          v="$(cat VERSION)"
          [ "v$v" = "$TAG" ] || { echo "::error::tag is $TAG but VERSION says $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')
          rm certificate.p12

      - name: Build and sign (universal)
        env:
          FIGNIMBLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          FIGNIMBLE_ARCHS: "arm64 x86_64"
        run: apps/macos/build_app.sh

      - name: Notarize and staple
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent apps/macos/Fignimble.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple apps/macos/Fignimble.app
          xcrun stapler validate apps/macos/Fignimble.app
          spctl --assess --type execute --verbose=4 apps/macos/Fignimble.app
          rm notarize.zip

      - name: Package
        run: ditto -c -k --keepParent apps/macos/Fignimble.app "Fignimble-$VERSION-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Fignimble-${{ env.VERSION }}-macOS
          path: Fignimble-*-macOS.zip
          if-no-files-found: error

      - name: Attach to the release
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Fignimble $VERSION" --notes "Fignimble $VERSION"
          gh release upload "$TAG" "Fignimble-$VERSION-macOS.zip" --clobber

      - name: Say why the release was left alone
        if: env.HAS_CERT != 'true' || env.HAS_NOTARY != 'true'
        run: echo "::warning::No Apple signing secrets in this repository, so the app is ad-hoc signed and kept as a workflow artifact; the release was not changed."
